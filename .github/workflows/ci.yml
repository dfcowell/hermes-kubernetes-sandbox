name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every supported Hermes release, oldest first. Keep a row while the plugin supports that release, and
        # add a new release's row as soon as it is published: a release can change a base-class signature the
        # plugin overrides (v0.23.3 added `cwd_fallback` to _wrap_command, which broke every command).
        hermes:
          - { tag: v0.22.1, commit: 297552a9d646119871391d202509822cd86330df }
          - { tag: v0.22.5, commit: bf0203a794a07aac3ff764972ab9087baa4e4f4e }
          - { tag: v0.23.1, commit: 3b421578588243f920886e6fe79a6faa87ea026e }
          - { tag: v0.23.3, commit: caafe5389ae585ef77387a962aee05b1bcf17029 }
    name: test (Hermes ${{ matrix.hermes.tag }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create venv
        run: uv venv -p 3.14 .venv
      - name: Clone Hermes at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git .hermes-src
          git -C .hermes-src checkout --quiet ${{ matrix.hermes.commit }}
      # From Hermes's own uv.lock (as its image does): v0.22.5's pins only resolve with the lock's
      # override-dependencies, which `uv pip install -e` ignores.
      - name: Install Hermes (editable, from its lockfile) and test tools
        run: |
          UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --frozen --project .hermes-src --python 3.14
          uv pip install --python .venv pytest==9.1.1 ruff==0.15.10
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Allow unprivileged user namespaces (the PID-1 tests run in `unshare -rpf`; they skip without)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        run: .venv/bin/pytest -v
      - name: Test the PyYAML fallback (older Hermes; v0.22+ ships no PyYAML, so these skip above)
        run: |
          uv pip install --python .venv pyyaml==6.0.3
          .venv/bin/pytest -v -k pyyaml
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python with PyYAML for the drift check and the plugin's Pod renderer
        run: |
          uv venv -p 3.14 .venv
          uv pip install --python .venv pyyaml==6.0.3
      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.33.1
          config: .github/kind-config.yaml
      - name: Apply the examples and dry-run plugin-rendered Pods
        run: PYTHON=.venv/bin/python ./scripts/validate-examples.sh --apply
