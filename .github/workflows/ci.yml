name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create venv
        run: uv venv -p 3.14 .venv
      - name: Clone Hermes at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git .hermes-src
          git -C .hermes-src checkout --quiet 297552a9d646119871391d202509822cd86330df
      - name: Install Hermes (editable) and test tools
        run: uv pip install --python .venv -e .hermes-src pytest==9.1.1 ruff==0.15.10
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Allow unprivileged user namespaces (the PID-1 tests run in `unshare -rpf`; they skip without)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        run: .venv/bin/pytest -v
      - name: Test the PyYAML fallback (older Hermes; v0.22+ ships no PyYAML, so these skip above)
        run: |
          uv pip install --python .venv pyyaml==6.0.3
          .venv/bin/pytest -v -k pyyaml
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python with PyYAML for the drift check and the plugin's Pod renderer
        run: |
          uv venv -p 3.14 .venv
          uv pip install --python .venv pyyaml==6.0.3
      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.33.1
          config: .github/kind-config.yaml
      - name: Apply the examples and dry-run plugin-rendered Pods
        run: PYTHON=.venv/bin/python ./scripts/validate-examples.sh --apply
