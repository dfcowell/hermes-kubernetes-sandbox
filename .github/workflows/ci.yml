name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.13 .venv
      - run: git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git .hermes-src && git -C .hermes-src checkout --quiet 524041b9d0437cd4424a524af4b9e26145e69ab0 && uv pip install --python .venv -e .hermes-src pytest==9.1.1 ruff==0.15.10
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pytest -v
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.33.1
      - run: ./scripts/validate-examples.sh
