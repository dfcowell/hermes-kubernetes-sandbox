# Driver ServiceAccount: what the Hermes gateway uses to manage sandbox Pods. Run the Hermes Pod
# AS this ServiceAccount (serviceAccountName), or, if it must keep its own, bind the Role below to
# that ServiceAccount instead. It lives in the Hermes namespace (`hermes` here -- CHANGE TO YOURS)
# and is granted rights only inside `agent-sandbox-runc`. The plugin never touches PVCs itself (the ephemeral-volume
# controller creates the Docker-disk PVC), so no PVC permissions are needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-sandbox-driver
  namespace: hermes # change to your Hermes namespace
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-sandbox-driver
  namespace: agent-sandbox-runc
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-sandbox-driver
  namespace: agent-sandbox-runc
subjects:
  - kind: ServiceAccount
    name: hermes-sandbox-driver
    namespace: hermes # change to your Hermes namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-sandbox-driver
