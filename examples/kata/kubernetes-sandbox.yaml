# Sample plugin settings: save as <HERMES_HOME>/kubernetes-sandbox.yaml
# (any key can also be set with a HERMES_K8S_<KEY> environment variable).
namespace: agent-sandbox
runtime_class_name: kata
docker: true
docker_disk_storage_class: <your RWO block StorageClass>   # must support volumeMode: Block
docker_disk_size: 30Gi
# Each session's /workspace is a PVC (filesystem volume) that outlives its Pods.
# workspace_storage_class: <your filesystem StorageClass>   # unset = the cluster's default StorageClass
# ReadWriteOncePod: exactly one Pod mounts the workspace at a time (needs a CSI driver with
# SINGLE_NODE_SINGLE_WRITER). Use ReadWriteOnce (per node) if your driver lacks it (see README.md).
workspace_access_mode: ReadWriteOncePod
workspace_size: 10Gi
workspace_retention: 7d   # the janitor deletes a workspace this long after it was last mounted
# Credentials of the hermes-sandbox-driver ServiceAccount, projected into the gateway container
# (see README.md, "Give the gateway the driver credentials").
token_path: /var/run/secrets/hermes-sandbox/token
ca_path: /var/run/secrets/hermes-sandbox/ca.crt
