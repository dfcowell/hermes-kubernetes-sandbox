# Driver ServiceAccount: what the Hermes gateway uses to manage sandbox Pods.
# It lives in the Hermes namespace (`hermes` here -- CHANGE TO YOURS) and is granted rights
# only inside `agent-sandbox`. The plugin never touches PVCs itself (the ephemeral-volume
# controller creates the Docker-disk PVC), so no PVC permissions are needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-sandbox-driver
  namespace: hermes # change to your Hermes namespace
automountServiceAccountToken: false
---
# Long-lived token for the driver SA, mounted into the Hermes gateway container only
# (see README.md). Holds token, ca.crt and namespace keys.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-sandbox-driver-token
  namespace: hermes # change to your Hermes namespace
  annotations:
    kubernetes.io/service-account.name: hermes-sandbox-driver
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-sandbox-driver
  namespace: agent-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-sandbox-driver
  namespace: agent-sandbox
subjects:
  - kind: ServiceAccount
    name: hermes-sandbox-driver
    namespace: hermes # change to your Hermes namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-sandbox-driver
---
# Janitor ServiceAccount (runs the CronJob in janitor.yaml): list and delete sandbox Pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-sandbox-janitor
  namespace: hermes # change to your Hermes namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-sandbox-janitor
  namespace: agent-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-sandbox-janitor
  namespace: agent-sandbox
subjects:
  - kind: ServiceAccount
    name: hermes-sandbox-janitor
    namespace: hermes # change to your Hermes namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-sandbox-janitor
