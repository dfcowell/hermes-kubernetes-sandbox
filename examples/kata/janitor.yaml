# REQUIRED: reaps idle, expired and finished sandbox Pods, and is the ONLY thing that deletes
# workspace volumes (unmounted for longer than their retention). The ConfigMap is GENERATED from
# janitor/janitor.py by `scripts/validate-examples.sh --render-janitor`; do not edit it by hand.
# metadata.namespace (here and on the CronJob): change `hermes` to your Hermes namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-sandbox-janitor
  namespace: hermes
data:
  janitor.py: |
    #!/usr/bin/env python3
    """Reap Hermes sandbox Pods (idle too long, past max lifetime, or finished) and workspace volumes
    unmounted for longer than their retention. Stdlib only."""
    from __future__ import annotations

    import datetime as dt
    import json
    import os
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    MANAGED_BY = ("app.kubernetes.io/managed-by", "hermes-kubernetes-sandbox")
    SELECTOR = "=".join(MANAGED_BY)
    PVC_SELECTOR = SELECTOR + ",app.kubernetes.io/component=workspace"
    ANN_UNUSED_SINCE = "hermes-sandbox/unused-since"
    ANN_RETENTION = "hermes-sandbox/workspace-retention-seconds"


    def iso(ts: float) -> str:
        return dt.datetime.fromtimestamp(ts, dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


    def parse(s: str | None) -> float | None:
        if not s:
            return None
        return dt.datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=dt.timezone.utc).timestamp()


    def decide(pod: dict, now: float, idle_seconds: int) -> str | None:
        md, ann = pod.get("metadata") or {}, (pod.get("metadata") or {}).get("annotations") or {}
        if (pod.get("status") or {}).get("phase") in ("Failed", "Succeeded"):
            return "finished"
        created = parse(md.get("creationTimestamp"))
        if created is None:
            raise ValueError(f"unparseable creationTimestamp: {md.get('creationTimestamp')}")
        max_life_str = ann.get("hermes-sandbox/max-lifetime-seconds", "86400")
        try:
            max_life = int(max_life_str)
        except ValueError:
            max_life = 86400
        if now - created > max_life:
            return "max-lifetime"
        last_str = ann.get("hermes-sandbox/last-used")
        try:
            last = parse(last_str) if last_str else created
        except ValueError:
            last = created
        if now - last > idle_seconds:
            return "idle"
        return None


    def mounted_claims(pods: list[dict]) -> set[str]:
        """claimNames referenced by any Pod that has not finished (terminating Pods still hold theirs)."""
        claims = set()
        for p in pods:
            if (p.get("status") or {}).get("phase") in ("Failed", "Succeeded"):
                continue
            for v in (p.get("spec") or {}).get("volumes") or []:
                claim = (v.get("persistentVolumeClaim") or {}).get("claimName")
                if claim:
                    claims.add(claim)
        return claims


    def decide_pvc(pvc: dict, mounted: bool, now: float, default_retention: int) -> str | None:
        """The idle clock is the janitor's own `unused-since` stamp (accurate to one run): never a
        gateway's clock. Anything unparseable restarts the clock; garbage never deletes a volume."""
        ann = (pvc.get("metadata") or {}).get("annotations") or {}
        if mounted:
            return "unstamp" if ANN_UNUSED_SINCE in ann else None
        try:
            since = parse(ann.get(ANN_UNUSED_SINCE))
        except ValueError:
            since = None
        if since is None or since > now:  # a stamp in the future (hand edit, skew) is malformed too
            return "stamp"
        try:
            retention = int(ann.get(ANN_RETENTION, ""))
        except ValueError:
            retention = default_retention
        if retention <= 0:
            retention = default_retention
        return "delete" if now - since > retention else None


    def _api(method: str, path: str, ctx, token: str, body: dict | None = None,
             content_type: str = "application/json") -> dict:
        url = "https://kubernetes.default.svc" + path
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method, headers={
            "Authorization": f"Bearer {token}", "Content-Type": content_type})
        with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
            return json.loads(r.read() or b"{}")


    def _load_api_context() -> tuple[str, object]:
        """Load service account token and SSL context. Factored for testability."""
        token = open(f"{SA}/token").read().strip()
        ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        return token, ctx


    def main() -> int:
        ns = os.environ.get("NAMESPACE", "agent-sandbox")
        idle = int(os.environ.get("IDLE_SECONDS", "3600"))
        retention = int(os.environ.get("WORKSPACE_RETENTION_SECONDS", "604800"))
        dry = os.environ.get("DRY_RUN") == "1"
        token, ctx = _load_api_context()
        # Every Pod in the namespace, listed once: the reap pass takes only ours, while any Pod
        # (ours or not) that mounts a workspace volume keeps that volume alive.
        all_pods = _api("GET", f"/api/v1/namespaces/{ns}/pods", ctx, token).get("items", [])
        pods = [p for p in all_pods
                if ((p.get("metadata") or {}).get("labels") or {}).get(MANAGED_BY[0]) == MANAGED_BY[1]]
        now = time.time()
        had_error = False
        for p in pods:
            try:
                name = p["metadata"]["name"]
                # Skip pods that are terminating
                if p.get("metadata", {}).get("deletionTimestamp"):
                    print(f"skip {name}: terminating")
                    continue
                reason = decide(p, now, idle)
                if reason is None:
                    print(f"keep {name}")
                    continue
                print(f"{'would delete' if dry else 'delete'} {name}: {reason}")
                if not dry:
                    uid = p["metadata"]["uid"]
                    try:
                        _api("DELETE", f"/api/v1/namespaces/{ns}/pods/{name}", ctx, token,
                             {"gracePeriodSeconds": 10, "preconditions": {"uid": uid}})
                    except urllib.error.HTTPError as e:
                        if e.code == 404:
                            print(f"gone {name}")
                        elif e.code == 409:
                            print(f"skip {name}: changed")
                        else:
                            raise
            except Exception as e:
                print(f"error {p.get('metadata', {}).get('name', 'unknown')}: {e}")
                had_error = True
        print(f"checked {len(pods)} sandbox pods")
        had_error = _workspace_pass(ns, ctx, token, mounted_claims(all_pods), now, retention, dry) or had_error
        return 1 if had_error else 0


    def _workspace_pass(ns: str, ctx, token: str, mounted: set[str], now: float, retention: int, dry: bool) -> bool:
        """Stamp unmounted workspace PVCs, clear the stamp when mounted again, delete expired ones."""
        q = urllib.parse.urlencode({"labelSelector": PVC_SELECTOR})
        pvcs = _api("GET", f"/api/v1/namespaces/{ns}/persistentvolumeclaims?{q}", ctx, token).get("items", [])
        had_error = False
        for c in pvcs:
            try:
                name = c["metadata"]["name"]
                if c["metadata"].get("deletionTimestamp"):
                    print(f"skip {name}: terminating")
                    continue
                action = decide_pvc(c, name in mounted, now, retention)
                if action is None:
                    print(f"keep {name}")
                    continue
                print(f"{'would ' if dry else ''}{action} {name}")
                if dry:
                    continue
                path = f"/api/v1/namespaces/{ns}/persistentvolumeclaims/{name}"
                if action in ("stamp", "unstamp"):
                    value = iso(now) if action == "stamp" else None
                    _api("PATCH", path, ctx, token, {"metadata": {"annotations": {ANN_UNUSED_SINCE: value}}},
                         content_type="application/merge-patch+json")
                    continue
                try:
                    # Only the PVC exactly as listed: if the plugin cleared the stamp since (a Pod started),
                    # its resourceVersion changed and this fails 409 -- skip, re-evaluate next run.
                    _api("DELETE", path, ctx, token, {"preconditions": {
                        "uid": c["metadata"]["uid"], "resourceVersion": c["metadata"]["resourceVersion"]}})
                except urllib.error.HTTPError as e:
                    if e.code == 404:
                        print(f"gone {name}")
                    elif e.code == 409:
                        print(f"skip {name}: changed")
                    else:
                        raise
            except Exception as e:
                print(f"error {(c.get('metadata') or {}).get('name', 'unknown')}: {e}")
                had_error = True
        print(f"checked {len(pvcs)} workspace volumes")
        return had_error


    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-sandbox-janitor
  namespace: hermes # change to your Hermes namespace
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: hermes-sandbox-janitor
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: janitor
            image: python:3.13-slim@sha256:bf44cdfcb76cd3b41e879bc058fc37ec5872002ccfde7fcb765e218cde0cd79c # bump deliberately
            command:
            - python3
            - /janitor/janitor.py
            env:
            - name: NAMESPACE
              value: agent-sandbox
            - name: IDLE_SECONDS
              value: '3600'
            # Fallback retention for workspace PVCs; each PVC's own
            # hermes-sandbox/workspace-retention-seconds annotation (the plugin's workspace_retention) wins.
            - name: WORKSPACE_RETENTION_SECONDS
              value: '604800'
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            volumeMounts:
            - name: janitor
              mountPath: /janitor
              readOnly: true
          volumes:
          - name: janitor
            configMap:
              name: hermes-sandbox-janitor
