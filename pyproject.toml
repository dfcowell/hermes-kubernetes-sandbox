[project]
name = "hermes-kubernetes-sandbox"
version = "0.1.0"
description = "Kubernetes terminal backend plugin for Hermes Agent"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = []  # runtime deps come from Hermes core: httpx, websockets, and its YAML loader

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", ".hermes-src"]
